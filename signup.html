<!DOCTYPE html>
<html lang="en">
<div>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    overflow:hidden;
    position:relative;
}

/* Background # Symbols */

body::before{
    content:"#  #  #  #  #  #  #  #  #  #  #  #  #  #  #  #  #";
    position:absolute;
    top:5%;
    left:-5%;
    width:120%;
    height:120%;
    color:rgba(0,170,255,.08);
    font-size:55px;
    line-height:85px;
    letter-spacing:35px;
    transform:rotate(-18deg);
    white-space:pre-wrap;
    user-select:none;
}

body::after{
    content:"#  #  #  #  #  #  #  #  #  #  #  #  #  #  #";
    position:absolute;
    bottom:-5%;
    right:-5%;
    width:120%;
    height:120%;
    color:rgba(0,132,255,.06);
    font-size:60px;
    line-height:90px;
    letter-spacing:35px;
    transform:rotate(18deg);
    white-space:pre-wrap;
    user-select:none;
}

/* Signup Box */

.signup-box{
    position:relative;
    width:420px;
    background:rgba(15,15,15,.92);
    border:2px solid #008cff;
    border-radius:20px;
    padding:40px;
    backdrop-filter:blur(10px);
    box-shadow:
    0 0 20px #008cff,
    0 0 60px rgba(0,140,255,.25);
    z-index:10;
}

.signup-box h1{
    text-align:center;
    color:#00aaff;
    margin-bottom:30px;
    font-size:35px;
}

.input-box{
    margin:18px 0;
}

.input-box input{
    width:100%;
    padding:14px;
    background:#111;
    border:2px solid #008cff;
    border-radius:10px;
    outline:none;
    color:white;
    font-size:15px;
    transition:.3s;
}

.input-box input:focus{
    box-shadow:0 0 15px #00aaff;
    border-color:#00d4ff;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#0066ff,#00b7ff);
    color:white;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
    transition:.4s;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 0 20px #00aaff;
}

.login-link{
    text-align:center;
    color:#ddd;
    margin-top:18px;
}

.login-link a{
    color:#00aaff;
    text-decoration:none;
    font-weight:600;
}

.login-link a:hover{
    text-decoration:underline;
}

.logo{
    text-align:center;
    font-size:45px;
    color:#00aaff;
    margin-bottom:10px;
}
</style>

</head>
<body>



<div class="signup-box">

<div class="logo">#</div>

<h1>Create Account</h1>
<div class="input-box">
<input type="text" placeholder="Full Name" required>
</div>

<div class="input-box">
<input type="email" placeholder="Email Address" required>
</div>

<div class="input-box">
<input type="text" placeholder="Username" required>
</div>

<div class="input-box">
<input type="password" placeholder="Password" required>
</div>

<div class="input-box">
<input type="password" placeholder="Confirm Password" required>
</div>
</div>


<form>

<button type="submit">Sign Up</button>

<div class="login-link">
Already have an account?
<a href="Login.html">Sign In</a>
</div>

</form>

</div>


</body>
</html>
